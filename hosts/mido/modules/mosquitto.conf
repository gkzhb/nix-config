# This broker is currently reachable on all interfaces. Keep anonymous access only
# while the network exposure is trusted; add authentication, ACLs, and TLS before
# exposing it to an untrusted network.
listener 1883
allow_anonymous true

# Store retained messages and persistent-client state in systemd's StateDirectory.
persistence true
persistence_location /var/lib/mosquitto/

# Bound state held for disconnected persistent clients: expire a session (and its
# queued messages) after seven days, and cap each client's offline queue.
persistent_client_expiration 7d
max_queued_messages 100
max_queued_bytes 1048576

log_dest stdout
