creation_rules:
  # First match wins: only share.yaml may be decrypted by zhb-nixos.
  # After enabling its recipient below, run: sops updatekeys secrets/share.yaml
  - path_regex: ^secrets/share\.yaml$
    key_groups:
      - age:
          - *admin
          # - *zhb_nixos
  - path_regex: secrets/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *admin
